name: Enterprise CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/eval-action
        with:
          python-version: ${{ matrix.python-version }}